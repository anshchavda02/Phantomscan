id: env-file-exposed
info:
  name: Exposed .env File
  author: phantomscan
  severity: high
  description: The .env file is publicly accessible and may contain database credentials, API keys, and secret tokens.
  tags: env,exposure,config,sensitive
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/

requests:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/api/.env"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "DB_PASSWORD"
          - "APP_SECRET"
          - "AWS_ACCESS_KEY"
          - "API_KEY"
          - "DATABASE_URL"
          - "SECRET_KEY"
          - "DB_HOST"
        condition: or
        part: body
      - type: word
        negative: true
        words:
          - "<!DOCTYPE"
          - "<html"
        part: body
