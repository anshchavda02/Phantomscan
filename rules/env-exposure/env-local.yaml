id: env-local-exposed
info:
  name: Exposed .env.local File
  author: phantomscan
  severity: high
  description: The .env.local file is publicly accessible and contains local environment configuration and keys.
  tags: env,exposure,config,sensitive
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/

requests:
  - method: GET
    path:
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/api/.env.local"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "DB_PASSWORD"
          - "APP_SECRET"
          - "AWS_ACCESS_KEY"
          - "API_KEY"
          - "DATABASE_URL"
          - "SECRET_KEY"
        condition: or
        part: body
      - type: word
        negative: true
        words:
          - "<!DOCTYPE"
          - "<html"
        part: body
