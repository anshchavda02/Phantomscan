id: web-config-exposed
info:
  name: Exposed web.config File
  author: phantomscan
  severity: high
  description: IIS web.config is publicly accessible and may contain database connection strings, application settings, and authentication secrets.
  tags: iis,config,exposure,sensitive
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/

requests:
  - method: GET
    path:
      - "{{BaseURL}}/web.config"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "<configuration>"
          - "connectionStrings"
          - "<appSettings>"
          - "<system.webServer>"
        condition: or
        part: body
      - type: word
        negative: true
        words:
          - "<!DOCTYPE html"
          - "<title>Login</title>"
          - "<title>Sign in</title>"
        condition: or
        part: body
