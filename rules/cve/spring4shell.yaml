id: spring-core-rce
info:
  name: Spring Framework ClassLoader DataBinder RCE (CVE-2022-22965)
  author: phantomscan
  severity: critical
  description: Remote code execution in Spring MVC / WebFlux on JDK 9+ through ClassLoader parameter binding and Tomcat access log valve manipulation.
  tags: cve,rce,spring,critical
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2022-22965
  metadata:
    cve-id: CVE-2022-22965
    cvss-score: 9.8

requests:
  - method: GET
    path:
      - "{{BaseURL}}/?class.module.classLoader.URLs%5B0%5D=jar"
      - "{{BaseURL}}/login?class.module.classLoader.URLs%5B0%5D=jar"
    matchers-condition: and
    matchers:
      - type: status
        status: [400, 500]
      - type: word
        words:
          - "class.module.classLoader"
          - "org.springframework"
        condition: or
        part: body
