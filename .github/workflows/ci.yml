name: PhantomScan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Python 3.11 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          python -m flake8 modules/ phantomscan.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity and line length
          python -m flake8 modules/ phantomscan.py --max-line-length 100 --count --exit-zero --statistics

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-test-results
          path: test-results.xml
          retention-days: 14
