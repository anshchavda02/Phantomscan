[package]
name = "phantomscan-rust"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", features = ["std", "ring"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
x509-parser = "0.16"

[profile.release]
opt-level = 3
strip = true
